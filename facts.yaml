- name: variables extension
  hosts: localhost
  connection: local
  tasks:
   - name: print a message
     ansible.builtin.debug:
      msg: "{{ ansible_facts }}"

   - name: config file update
     ansible.builtin.copy:
      content: "IP -- {{ ansible_facts['all_ipv4_addresses'] }} "
      dest: /tmp/IP

   - name: register a variables
     ansible.builtin.command: df -h
     register: disk_output

   - name: show the variables
     ansible.builtin.debug:
      msg: " the variable is {{ disk_output }}" 