- name: add user
  ansible.builtin.user:
   name: appuser
   shell: /bin/false

- name: create /app directory
  ansible.builtin.file:
   path: /app
   state: directory
   owner: appuser
   group: appuser
   mode: '0755'

- name: Download and extract the application
  ansible.builtin.unarchive:
   src: https://raw.githubusercontent.com/raghudevopsb88/wealth-project/main/artifacts/{{ COMPONENT }}.tar.gz
   dest: /app
   remote_src: yes