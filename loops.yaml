- name: install git, curl, nginx
  hosts: localhost
  connection: local
  tasks:
   - name: installation
     ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
     loop:
      - git
      - curl
      - nginx
   - name: create users
     ansible.builtin.user:
      name: "{{ item.name }}" 
      group: "{{ item.uid }}"
     loop:
      - { name: Sumant ,uid: 100 }
      - { name: Usha ,uid: 200 }
